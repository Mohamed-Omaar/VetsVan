<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VETS VAN Admin Login</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--p:#A32890;--g:#58595C;--b:#000;--w:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4f6;font-family:Inter,sans-serif;color:var(--g)}.card{width:min(440px,calc(100% - 32px));background:#fff;border-radius:28px;padding:42px;box-shadow:0 24px 70px #00000012}.brand{display:flex;gap:12px;align-items:center;margin-bottom:32px}.mark{width:48px;height:48px;border-radius:15px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}.brand strong{display:block;color:#000;font-size:18px}.brand span{font-size:11px;letter-spacing:2px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:var(--p)}h1{color:#000;margin:5px 0 10px;font-size:32px}p{line-height:1.6}label{display:block;font-size:13px;font-weight:700;color:#000;margin:18px 0 7px}input{width:100%;padding:14px 15px;border:1px solid #ddd;border-radius:12px;font:inherit;outline:none}input:focus{border-color:var(--p);box-shadow:0 0 0 3px #a3289014}button{width:100%;margin-top:24px;border:0;border-radius:999px;background:var(--p);color:#fff;padding:15px;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.6}.error{display:none;background:#fff0f0;color:#a22;padding:11px 13px;border-radius:10px;margin-top:16px;font-size:13px}</style></head><body><form class="card" id="login"><div class="brand"><div class="mark">V</div><div><strong>VETS VAN</strong><span>ADMIN PORTAL</span></div></div><div class="eyebrow">SECURE ACCESS</div><h1>Welcome back</h1><p>Sign in to manage bookings, services and website content.</p><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Sign In</button><div class="error" id="error"></div></form><script>if(localStorage.getItem('vetsvan_token'))location.href='/admin/';document.getElementById('login').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),err=document.getElementById('error');b.disabled=true;err.style.display='none';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Login failed');localStorage.setItem('vetsvan_token',x.token);localStorage.setItem('vetsvan_user',JSON.stringify(x.user));location.href='/admin/'}catch(x){err.textContent=x.message;err.style.display='block'}finally{b.disabled=false}}</script></body></html>

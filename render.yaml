services:
  - type: web
    name: vetsvan
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vetsvan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: vetsvan-db
    plan: free
